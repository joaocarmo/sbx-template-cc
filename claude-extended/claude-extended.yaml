# syntax=docker/sandbox-kit:3@sha256:e6a397771e865625047cf84256a914c7974b3e749d858259b5bc9c653ddb6f0d
schemaVersion: "3"
kind: set
kits:
  - ref: docker.io/docker/sbx-kit-claude:2.1.316
    digest: sha256:60a90df50354b1bb737b0f47bc2aad0475b36e019c65361173feace3efcf662a
  - ref: docker.io/sbx/git-ssh-sign:1.0.2
    digest: sha256:49e2ad68630f3cb511698ae652be69a1a9c5e7341ed741f2023fc5eac9e1f482
  - ref: docker.io/sbx/claude-sbx-statusline:1.0.0
    digest: sha256:820ba62f72b262b7bc12528833fd35b12b07826b9457d677b0684993968f3943
capabilities:
  # git-ssh-sign doesn't request this itself yet
  - type: com.docker.sandbox/git-identity@1
    optional: true
    description: Attribute commits to the host's git identity
  # Mounts keep their host path, so the glob finds ~/.config/claude-sbx on any host
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command:
            - sh
            - -c
            - |
              for f in /*/*/.config/claude-sbx/CLAUDE.md; do
                [ -f "$f" ] || continue
                mkdir -p /home/agent/.claude/rules
                ln -sfn "$f" /home/agent/.claude/rules/claude-sbx.md
              done
          user: "1000"
          description: Link a mounted ~/.config/claude-sbx/CLAUDE.md into ~/.claude/rules
        # The sandbox policy blocks port 22, so SSH remotes to GitHub must use HTTPS
        - command:
            - sh
            - -c
            - |
              mkdir -p /home/agent/.config/git
              printf '[url "https://github.com/"]\n\tinsteadOf = git@github.com:\n\tinsteadOf = ssh://git@github.com/\n' > /home/agent/.config/git/config
          user: "1000"
          description: Rewrite GitHub SSH remotes to HTTPS
