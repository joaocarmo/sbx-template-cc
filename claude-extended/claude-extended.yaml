# syntax=docker/sandbox-kit:3@sha256:adbc0d1ea63451871d5d78111120bb29f2fd2b265e63d39c664ae2c3d722c805
schemaVersion: "3"
kind: set
kits:
  - ref: docker.io/docker/sbx-kit-claude:2.1.316
    digest: sha256:60a90df50354b1bb737b0f47bc2aad0475b36e019c65361173feace3efcf662a
  - ref: docker.io/sbx/git-ssh-sign:1.0.1
    digest: sha256:5272b8c3592c85da8eed85890c08e547f8fc002d2b41d22d7f675cbbf240b7b0
  - ref: docker.io/sbx/claude-sbx-statusline:1.0.0
    digest: sha256:8e88993909464b33b323d2b25d34b43a03c10ddaa20b80cc67d46342763cd3dc
# git-ssh-sign (v3) doesn't request these itself yet
capabilities:
  - type: com.docker.sandbox/ssh-agent@1
    optional: true
    description: Sign git commits and tags with the host's SSH key
    config:
      phase: runtime
      unrestricted: false
      sign: [git]
  - type: com.docker.sandbox/git-identity@1
    optional: true
    description: Attribute commits to the host's git identity
  # Mounts keep their host path, so the glob finds ~/.config/claude-sbx on any host
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command:
            - sh
            - -c
            - |
              for f in /*/*/.config/claude-sbx/CLAUDE.md; do
                [ -f "$f" ] || continue
                mkdir -p /home/agent/.claude/rules
                ln -sfn "$f" /home/agent/.claude/rules/claude-sbx.md
              done
          user: "1000"
          description: Link a mounted ~/.config/claude-sbx/CLAUDE.md into ~/.claude/rules
