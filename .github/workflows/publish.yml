name: publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(sed -n 's|.*docker/sbx-kit-claude:\([^[:space:]]*\).*|\1|p' claude-extended/claude-extended.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: upstream
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1.18.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      # ponytail: repo-root context (as in github-builder's own tests); fine while the set ships no files
      file: claude-extended/claude-extended.yaml
      platforms: linux/arm64
      meta-images: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/claude-extended
      meta-tags: |
        type=raw,value=${{ needs.upstream.outputs.version }},enable={{is_default_branch}}
        type=raw,value=latest,enable={{is_default_branch}}
        type=sha,format=long
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      SBX_VERSION: v0.49.1
      # Bump together with SBX_VERSION: sha256 of DockerSandboxes-linux-amd64-ubuntu2404.deb
      SBX_DEB_SHA256: 9536d6a07270aa7a75752106d90257115bce20898056b4d798bc48f67c116bf9
    steps:
      # Runs on PRs too, so a Renovate SBX_VERSION bump fails CI until the checksum is updated.
      - name: Install sbx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$SBX_VERSION" -R docker/sbx-releases -p 'DockerSandboxes-linux-amd64-ubuntu2404.deb'
          echo "$SBX_DEB_SHA256  DockerSandboxes-linux-amd64-ubuntu2404.deb" | sha256sum -c -
          sudo apt-get install -y ./DockerSandboxes-linux-amd64-ubuntu2404.deb

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ponytail: assumes `sbx kit sign` on an OCI ref works without sandboxd/`sbx login`; if not, swap for cosign
      - if: github.event_name != 'pull_request'
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/claude-extended@${{ needs.build.outputs.digest }}
        run: sbx kit sign "$IMAGE"
