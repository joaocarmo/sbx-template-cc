name: publish

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_NAMESPACE }}/claude-extended
  SBX_VERSION: v0.49.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: github.ref_type == 'tag'
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: claude-extended
          file: claude-extended/claude-extended.yaml
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ github.ref_type == 'tag' && format('{0}:{1}', env.IMAGE, steps.version.outputs.version) || '' }}

      # ponytail: assumes `sbx kit sign` on an OCI ref works without sandboxd/`sbx login`; if not, swap for `cosign sign --yes`
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release download "$SBX_VERSION" -R docker/sbx-releases -p 'DockerSandboxes-linux-amd64-ubuntu2404.deb'
          sudo apt-get install -y ./DockerSandboxes-linux-amd64-ubuntu2404.deb
          sbx kit sign "$IMAGE@$DIGEST"
