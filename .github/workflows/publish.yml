name: publish

on:
  push:
    branches: [main]
    paths: [claude-extended/**, .github/workflows/publish.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/claude-extended
  # Renovate bumps both; the sha256 is of DockerSandboxes-linux-amd64-ubuntu2604.deb
  SBX_VERSION: v0.50.0
  SBX_DEB_SHA256: 91082b11c616448913042b52fba5f1ed9f3c620a68cfb22714b4a83aea22ecd1

jobs:
  # Boots the kit from source in a real sandbox. Runners only have KVM on x86, so this is an amd64
  # build; the published arm64 image can't boot here.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # sbx builds the source kit with buildx, which needs a builder that can export OCI.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install sbx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$SBX_VERSION" -R docker/sbx-releases -p 'DockerSandboxes-linux-amd64-ubuntu2604.deb'
          echo "$SBX_DEB_SHA256  DockerSandboxes-linux-amd64-ubuntu2604.deb" | sha256sum -c -
          sudo apt-get install -y ./DockerSandboxes-linux-amd64-ubuntu2604.deb

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sign in to sbx
        env:
          USERNAME: ${{ vars.DOCKERHUB_NAMESPACE }}
          TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
        run: printf '%s' "$TOKEN" | sbx login --username "$USERNAME" --password-stdin

      # The hook's /*/*/.config glob matches $HOME=/home/runner
      - name: Smoke test
        run: |
          mkdir -p ~/.config/claude-sbx
          echo smoke > ~/.config/claude-sbx/CLAUDE.md
          sbx policy init balanced
          sbx run ./claude-extended -d --name ci . ~/.config/claude-sbx:ro
          sbx exec ci claude --version
          sbx exec ci grep -qx smoke /home/agent/.claude/rules/claude-sbx.md

  # docker/github-builder fails here: its BuildKit lacks moby.buildkit.frontend.inputs, which the sandbox-kit frontend needs.
  build:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: upstream
        run: |
          version=$(sed -n 's|.*docker/sbx-kit-claude:\([^[:space:]]*\).*|\1|p' claude-extended/claude-extended.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: claude-extended
          file: claude-extended/claude-extended.yaml
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - if: github.event_name != 'pull_request'
        name: Install sbx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$SBX_VERSION" -R docker/sbx-releases -p 'DockerSandboxes-linux-amd64-ubuntu2604.deb'
          echo "$SBX_DEB_SHA256  DockerSandboxes-linux-amd64-ubuntu2604.deb" | sha256sum -c -
          sudo apt-get install -y ./DockerSandboxes-linux-amd64-ubuntu2604.deb

      - if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: sbx kit sign "$IMAGE@$DIGEST"
